<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Accelerometer Plots</title>
<style>
  :root{
    --bg:#071025;
    --card:#071827;
    --muted:#9fb0c8;
    --accent:#38bdf8;
    --h:110px;
  }
  html,body{height:100%;margin:0;background:linear-gradient(180deg,#041022,#071025);color:#e6f2fb;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial;}
  .topbar{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid rgba(255,255,255,0.03)}
  .title{font-weight:600;font-size:15px}
  .controls{margin-left:auto;display:flex;gap:6px;align-items:center}
  button,select,input{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.04);color:inherit;padding:8px 10px;border-radius:8px;font-size:13px}
  button:disabled{opacity:0.5}
  .container{padding:8px;display:flex;flex-direction:column;gap:8px;height:calc(100vh - 56px);box-sizing:border-box}
  .plot{background:linear-gradient(180deg, rgba(255,255,255,0.01), transparent);border-radius:8px;padding:6px;display:flex;flex-direction:column;gap:6px;flex:1;min-height:0}
  .label{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted)}
  canvas{width:100%;height:100%;border-radius:6px;display:block}
  .row{display:flex;gap:8px;align-items:center}
  .small{font-size:12px;color:var(--muted)}
  .compact{padding:6px 8px;font-size:12px;border-radius:6px}
  .footer{padding:8px;font-size:12px;color:var(--muted);text-align:center}
  @media (min-width:900px){
    :root{--h:120px}
    .container{padding:12px}
  }
</style>
</head>
<body>
  <div class="topbar">
    <div class="title">Accelerometer Live</div>
    <div class="controls">
      <button id="permBtn" class="compact">Request Motion Permission</button>
      <label class="small">Rate
        <select id="rateSelect" class="compact" title="Requested rate (Hz)">
          <option value="60" selected>60</option>
          <option value="30">30</option>
          <option value="120">120</option>
        </select>
      </label>
      <button id="startBtn" class="compact">Start</button>
      <button id="stopBtn" class="compact" disabled>Stop</button>
    </div>
  </div>

  <div class="container" id="main">
    <div class="plot" style="flex-basis:var(--h);">
      <div class="label"><strong>X axis</strong><div class="row"><div id="xVal">0.00</div><div class="small" id="rateX"></div></div></div>
      <canvas id="cX"></canvas>
    </div>

    <div class="plot" style="flex-basis:var(--h);">
      <div class="label"><strong>Y axis</strong><div class="row"><div id="yVal">0.00</div><div class="small" id="rateY"></div></div></div>
      <canvas id="cY"></canvas>
    </div>

    <div class="plot" style="flex-basis:var(--h);">
      <div class="label"><strong>Z axis</strong><div class="row"><div id="zVal">0.00</div><div class="small" id="rateZ"></div></div></div>
      <canvas id="cZ"></canvas>
    </div>

    <div class="plot" style="flex-basis:var(--h);">
      <div class="label"><strong>Resultant</strong><div class="row"><div id="rVal">0.00</div><label class="small">Autoscale <input id="autoscale" type="checkbox" checked></label></div></div>
      <canvas id="cR"></canvas>
    </div>
  </div>

  <div class="footer small" id="status">status: ready</div>

<script>
/* Low-latency accelerometer plotting
   - Samples pushed directly from devicemotion handler
   - Per-pixel ring buffers sized to canvas width
   - Draw on requestAnimationFrame
   - Shows measured event rate
*/

const canvases = {
  x: document.getElementById('cX'),
  y: document.getElementById('cY'),
  z: document.getElementById('cZ'),
  r: document.getElementById('cR')
};
const vals = {
  x: document.getElementById('xVal'),
  y: document.getElementById('yVal'),
  z: document.getElementById('zVal'),
  r: document.getElementById('rVal')
};
const rateEls = {
  x: document.getElementById('rateX'),
  y: document.getElementById('rateY'),
  z: document.getElementById('rateZ')
};
const statusEl = document.getElementById('status');
const permBtn = document.getElementById('permBtn');
const startBtn = document.getElementById('startBtn');
const stopBtn = document.getElementById('stopBtn');
const rateSelect = document.getElementById('rateSelect');
const autoscaleCheckbox = document.getElementById('autoscale');

let ctx = {};
let pixelRatio = Math.max(1, window.devicePixelRatio || 1);

// ring buffers and state
let buffers = {};        // Float32Array per axis
let bufferLen = 0;       // equals canvas width in CSS pixels
let writePos = 0;
let running = false;
let lastDraw = 0;
let lastEventTime = 0;
let latest = {x:0,y:0,z:0};
let eventCount = 0;
let eventCountStart = performance.now();
let requestedHz = Number(rateSelect.value) || 60;

// initialize canvases for high DPI and create buffers sized to width
function setupAll(){
  pixelRatio = Math.max(1, window.devicePixelRatio || 1);
  for (let k in canvases){
    const c = canvases[k];
    const rect = c.getBoundingClientRect();
    // ensure a minimum width
    const cssW = Math.max(200, Math.floor(rect.width));
    const cssH = Math.max(40, Math.floor(rect.height));
    c.width = Math.floor(cssW * pixelRatio);
    c.height = Math.floor(cssH * pixelRatio);
    const cctx = c.getContext('2d');
    cctx.setTransform(pixelRatio,0,0,pixelRatio,0,0);
    ctx[k] = cctx;
  }
  // buffer length equals CSS pixel width of first canvas
  const cssWidth = Math.floor(canvases.x.getBoundingClientRect().width);
  bufferLen = Math.max(200, cssWidth); // at least 200 samples
  // allocate buffers
  buffers.x = new Float32Array(bufferLen);
  buffers.y = new Float32Array(bufferLen);
  buffers.z = new Float32Array(bufferLen);
  buffers.r = new Float32Array(bufferLen);
  // zero
  for (let i=0;i<bufferLen;i++){buffers.x[i]=0;buffers.y[i]=0;buffers.z[i]=0;buffers.r[i]=0;}
  writePos = 0;
}
window.addEventListener('load', setupAll);
window.addEventListener('resize', () => { setupAll(); drawImmediate(); });

// permission for iOS
async function requestPermission(){
  if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function'){
    try {
      const res = await DeviceMotionEvent.requestPermission();
      statusEl.textContent = 'permission: ' + res;
    } catch (err){
      statusEl.textContent = 'permission error';
      console.warn(err);
    }
  } else {
    statusEl.textContent = 'permission not required';
  }
}

// devicemotion handler: push sample immediately into ring buffer
function onDeviceMotion(e){
  // prefer acceleration (without gravity) if available, else includingGravity
  const a = e.acceleration && (e.acceleration.x !== null) ? e.acceleration : (e.accelerationIncludingGravity || {x:0,y:0,z:0});
  const x = a.x || 0;
  const y = a.y || 0;
  const z = a.z || 0;
  const r = Math.hypot(x,y,z);
  // write into buffers at current writePos (per-pixel)
  buffers.x[writePos] = x;
  buffers.y[writePos] = y;
  buffers.z[writePos] = z;
  buffers.r[writePos] = r;
  // update numeric displays immediately
  vals.x.textContent = x.toFixed(2);
  vals.y.textContent = y.toFixed(2);
  vals.z.textContent = z.toFixed(2);
  vals.r.textContent = r.toFixed(2);
  latest.x = x; latest.y = y; latest.z = z;
  // advance write position (wrap)
  writePos = (writePos + 1) % bufferLen;
  // event rate measurement
  eventCount++;
  const now = performance.now();
  if (now - eventCountStart >= 500){ // update every 0.5s
    const hz = Math.round((eventCount * 1000) / (now - eventCountStart));
    rateEls.x.textContent = hz ? `${hz} Hz` : '';
    rateEls.y.textContent = '';
    rateEls.z.textContent = '';
    eventCount = 0;
    eventCountStart = now;
  }
  lastEventTime = now;
}

// start/stop
function start(){
  if (running) return;
  requestedHz = Number(rateSelect.value) || 60;
  // try to hint desired frequency by using addEventListener options where supported
  // Note: many browsers ignore frequency hints; we still measure actual rate.
  try {
    window.addEventListener('devicemotion', onDeviceMotion, {passive:true});
  } catch (err){
    window.addEventListener('devicemotion', onDeviceMotion, false);
  }
  running = true;
  startBtn.disabled = true;
  stopBtn.disabled = false;
  statusEl.textContent = `running (requested ${requestedHz} Hz)`;
  requestAnimationFrame(drawLoop);
}

function stop(){
  if (!running) return;
  window.removeEventListener('devicemotion', onDeviceMotion);
  running = false;
  startBtn.disabled = false;
  stopBtn.disabled = true;
  statusEl.textContent = 'stopped';
}

// drawing helpers
function clear(c, cctx){
  const rect = c.getBoundingClientRect();
  cctx.clearRect(0,0,rect.width,rect.height);
}
function drawGrid(c, cctx, ticks=4){
  const rect = c.getBoundingClientRect();
  cctx.save();
  cctx.strokeStyle = 'rgba(255,255,255,0.04)';
  cctx.lineWidth = 1;
  for (let i=0;i<=ticks;i++){
    const y = (rect.height / ticks) * i;
    cctx.beginPath();
    cctx.moveTo(0.5, y+0.5);
    cctx.lineTo(rect.width+0.5, y+0.5);
    cctx.stroke();
  }
  cctx.restore();
}
function drawBuffer(c, cctx, data, color, yRange){
  const rect = c.getBoundingClientRect();
  const w = Math.floor(rect.width);
  const h = Math.floor(rect.height);
  cctx.save();
  cctx.beginPath();
  cctx.lineWidth = 1.6;
  cctx.strokeStyle = color;
  // oldest sample is writePos (next to be overwritten)
  let idx = writePos;
  // map each horizontal pixel to one buffer sample; if bufferLen != w, sample step
  const step = Math.max(1, Math.floor(bufferLen / w));
  for (let px=0; px<w; px++){
    // pick sample at idx
    const val = data[idx];
    const y = h/2 - (val / yRange) * (h/2);
    if (px === 0) cctx.moveTo(px + 0.5, y + 0.5);
    else cctx.lineTo(px + 0.5, y + 0.5);
    // advance idx by step
    idx = (idx + step) % bufferLen;
  }
  cctx.stroke();
  cctx.restore();
}

// autoscale helper for resultant
function computeRange(data){
  // compute max absolute in buffer
  let maxv = 0;
  for (let i=0;i<bufferLen;i++){
    const v = Math.abs(data[i]);
    if (v > maxv) maxv = v;
  }
  // add margin
  return Math.max(1, maxv * 1.2);
}

// main draw loop
function drawLoop(ts){
  // throttle draw to ~60fps via requestAnimationFrame naturally
  // clear and draw each canvas
  // choose ranges: X/Y/Z use fixed +/-20 m/s^2; resultant autoscale if enabled
  const ranges = {x:20, y:20, z:20, r: autoscaleCheckbox.checked ? computeRange(buffers.r) : 30};
  // draw each
  drawOne('x', '#ef4444', ranges.x);
  drawOne('y', '#f59e0b', ranges.y);
  drawOne('z', '#10b981', ranges.z);
  drawOne('r', '#60a5fa', ranges.r);
  if (running) requestAnimationFrame(drawLoop);
}

function drawOne(key, color, range){
  const c = canvases[key];
  const cctx = ctx[key];
  clear(c, cctx);
  drawGrid(c, cctx, 4);
  drawBuffer(c, cctx, buffers[key], color, range);
}

// immediate redraw (useful after resize)
function drawImmediate(){
  if (!ctx.x) return;
  drawLoop();
}

// UI wiring
permBtn.addEventListener('click', requestPermission);
startBtn.addEventListener('click', start);
stopBtn.addEventListener('click', stop);

// initialize
setupAll();
statusEl.textContent = 'ready — request permission on iOS then Start';

// warm buffers
for (let i=0;i<bufferLen;i++){buffers.x[i]=0;buffers.y[i]=0;buffers.z[i]=0;buffers.r[i]=0;}
drawImmediate();

</script>
</body>
</html>
